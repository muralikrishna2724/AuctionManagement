    const c = squad.filter(p => p.role === r).length;
    dev += Math.abs((n ? c / n : 0) - ideal[r]);
    if (c < (R.roleMin[r] || 0)) unmet += (R.roleMin[r] - c);
  }
  const balance = n ? Math.round(clamp(100 - dev * 110 - unmet * 8, 0, 100)) : 0;
  const fair = sum(squad.map(fairPrice));
  const paid = sum(squad.map(p => p.soldPrice || 0));
  const value = n && fair ? Math.round(clamp(50 + 100 * (fair - paid) / fair, 0, 100)) : 0;
  const overall = Math.round(0.25 * strength + 0.2 * balance + 0.15 * versatility + 0.15 * value + 0.1 * batting + 0.1 * bowling + 0.05 * wk);
  return { strength, balance, versatility, value, batting, bowling, wk, overall };
}

/* ---------- Auction statistics ---------- */
function computeStats() {
  const sold = S.players.filter(p => p.status === 'sold');
  const unsold = S.players.filter(p => p.status === 'unsold');
  const avail = S.players.filter(p => p.status === 'available' && !inSurprisePool(p));
  const bids = S.log.filter(e => e.type === 'bid' && !e.voided);
  const most = sold.slice().sort((a, b) => b.soldPrice - a.soldPrice)[0] || null;
  const hb = bids.slice().sort((a, b) => b.amt - a.amt)[0] || null;
  const perLot = new Map();
  for (const b of bids) {
    if (!perLot.has(b.lot)) perLot.set(b.lot, { lot: b.lot, pid: b.pid, n: 0, teams: new Map() });
    const x = perLot.get(b.lot); x.n++; x.teams.set(b.tid, (x.teams.get(b.tid) || 0) + 1);
  }
  let war = null;
  for (const x of perLot.values()) if (!war || x.n > war.n) war = x;
  if (war) war.top = Array.from(war.teams.entries()).sort((a, b) => b[1] - a[1]).slice(0, 2).map(e => e[0]);
  let bargain = null;
  for (const p of sold) {
    const g = (fairPrice(p) - p.soldPrice) * Math.pow(p.rating / 100, 2);
    if (!bargain || g > bargain.gain) bargain = { p, gain: g };
  }
  const ti = S.teams.map(t => ({ t, spent: sum(sold.filter(p => p.soldTo === t.id).map(p => p.soldPrice)), n: sold.filter(p => p.soldTo === t.id).length }));
  const purseOf = t => S.rules.purse + sum((t.adjust || []).map(a => a.amt)) - sum(sold.filter(p => p.soldTo === t.id).map(p => p.soldPrice));
  const mostSpent = ti.slice().sort((a, b) => b.spent - a.spent)[0] || null;
  const mostPurse = S.teams.slice().sort((a, b) => purseOf(b) - purseOf(a))[0] || null;
  const mostPlayers = ti.slice().sort((a, b) => b.n - a.n)[0] || null;
  const total = sum(sold.map(p => p.soldPrice));
  return {
    sold: sold.length, unsold: unsold.length, left: avail.length,
    most, hb, war, bargain, mostSpent, mostPurse, mostPurseAmt: mostPurse ? purseOf(mostPurse) : 0, mostPlayers,
    avg: sold.length ? Math.round(total / sold.length) : 0, total,
    mysterySold: sold.filter(p => p.mystery).length, wildSold: sold.filter(p => p.wild).length,
    pool: unsold.filter(p => p.pool).length, bids: bids.length,
  };
}

/* ---- 30-actions.js ---- */
/* ================= Auction actions ================= */
/* Sort players into the standard sets. With a list, only those players move and existing order is kept. */
function autoBuildSets(only) {
  const sets = S.sets.slice();
  for (const p of (only || S.players)) {
    if (p.round2 && !only) continue;
    const k = autoSetKind(p);
    let s = sets.find(x => x.kind === k);
    if (!s) { s = { id: uid('set'), name: AUTO_SETS.find(a => a[0] === k)[1], kind: k }; sets.push(s); }
    p.setId = s.id;
  }
  const isAuto = s => AUTO_SETS.some(a => a[0] === s.kind);
  const live = sets.filter(s => !isAuto(s) || S.players.some(p => p.setId === s.id));
  if (only) { S.sets = live; return; }
  const rank = s => { const i = AUTO_SETS.findIndex(a => a[0] === s.kind); return i >= 0 ? i : s.kind === 'unsold' ? 999 : 500; };
  S.sets = live.sort((a, b) => rank(a) - rank(b));
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* rules.order: 'random' pops players from the whole pool at random, 'sets' goes set by set
   in random order inside each set, 'queue' goes set by set in player-number order. */
function rebuildQueue() {
  const mode = S.rules.order || 'random';
  const arrange = list => { list.sort((a, b) => orderKey(a) - orderKey(b)); return mode === 'queue' ? list : shuffle(list); };
  const q = [];
  if (mode === 'random') {
    const all = S.players.filter(queueable);
    arrange(all.filter(p => !p.round2)).concat(arrange(all.filter(p => p.round2))).forEach(p => q.push(p.id));
    S.queue = q;
    return;
  }
  for (const s of S.sets) arrange(S.players.filter(p => p.setId === s.id && queueable(p))).forEach(p => q.push(p.id));
  arrange(S.players.filter(p => queueable(p) && !q.includes(p.id) && !S.sets.some(s => s.id === p.setId))).forEach(p => q.push(p.id));
  S.queue = q;
}
/* Shuffle the players already in the queue, keeping sets together in 'sets' mode and the unsold round last. */
function shuffleQueue() {
  const groups = new Map();
  const key = p => (p.round2 ? 'r2' : S.rules.order === 'sets' ? 's:' + (p.setId || '') : 'all');
  S.queue.map(id => P(id)).filter(Boolean).forEach(p => { const k = key(p); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p.id); });
  S.queue = [...groups.values()].flatMap(shuffle);
}

/* No timer: the auctioneer closes the bidding by hand. Each click calls
   "going once", then "going twice", then closes it. A new bid reopens it. */
function closeCall() {
  const lv = S.live;
  if (!lv.pid || lv.phase === 'empty' || lv.phase === 'done') return toast('No player on the block.', 'warn');
  if (lv.phase === 'ready') return toast('Start the bidding first.', 'info');
  if ((lv.call || 0) >= 2) return closeBidding();
  commit(() => { lv.call = (lv.call || 0) + 1; });
  SFX.call(lv.call);
}
/* Closing sells to the highest bidder, or marks the player unsold when nobody bid. */
function closeBidding() {
  if (lead()) askSold();
  else openUnsold();
}

function loadLot(pid, how) {
  const p = S.players.find(x => x.id === pid);
  if (!p) return;
  S.started = true;
  const l = [...S.lots].reverse().find(x => x.how !== 'surprise');
  const prevSet = l ? (S.players.find(x => x.id === l.pid) || {}).setId : null;
  S.queue = S.queue.filter(x => x !== pid);
  if (p.status === 'unsold') { p.status = 'available'; p.pool = false; }
  S.live = Object.assign(emptyLive(), { lotId: uid('lot'), pid, phase: 'ready', revealed: !(p.mystery && !p.revealed), how: how || 'queue',
    shown: how === 'surprise' || S.rules.curtain === false || SIM });   // surprises have their own entrance
  if (p.wild && !S.wildUsed.includes(pid)) { S.wildUsed.push(pid); p.wildAt = NOW(); }
  // "Now starting set …" only makes sense when players go set by set; with the curtain down it waits for the reveal
  if (how !== 'surprise' && p.setId && p.setId !== prevSet && S.rules.order !== 'random') {
    if (S.live.shown === false) S.live.setFx = p.setId;
    else fire('set', { setId: p.setId, pid }, true);
  }
}
function loadLotNow(pid, how) { commit(() => loadLot(pid, how)); }
/* Moving on after a result is when a surprise can pop in. */
function advance(afterResult) {
  S.queue = S.queue.filter(id => queueable(S.players.find(p => p.id === id)));
  if (!S.started) { S.live = emptyLive(); return; }
  if (afterResult && surpriseDue()) {
    let pick = surpriseNext();
    if (pick && !pick.manual && pick.kind === 'wild' && !wildTimingOK()) pick = null;
    if (!pick) pick = pickSurprise();
    if (pick) return loadSurprise(pick.p, pick.kind);
  }
  const next = S.queue[0];
  if (next) loadLot(next, 'queue');
  else S.live = emptyLive();
}
function finishLot(result) {
  const l = lastLot();
  if (!l || l.how !== 'surprise') S.surprise.since++;
  if (S.rules.autoAdvance || SIM) advance(true);
  else { S.live.phase = 'done'; S.live.result = result; S.live.call = 0; }
}
function loadSurprise(p, kind) {
  const R = S.rules.surprise;
  const chained = !!(S.fx && !S.fx.dismissed && NOW() - S.fx.at < 300);
  loadLot(p.id, 'surprise');
  const lv = S.live;
  p.surprised = true;
  S.surprise.since = 0;
  S.surprise.gap = Math.round(R.min + RNG() * Math.max(0, R.max - R.min));
  S.surprise.n[kind] = (S.surprise.n[kind] || 0) + 1;
  S.surprise.next = null;
  rollNextSurprise();
  if (kind === 'wild') {
    lv.revealed = true; lv.phase = 'bidding'; lv.startedAt = NOW();
    log({ type: 'wild', pid: p.id, note: 'entered the auction by surprise' });
    log({ type: 'start', pid: p.id });
    fire('wild', { pid: p.id }, true);
  } else {
    if (!p.mcode) p.mcode = nextCode('M-', 'mcode');
    if (!p.clues || !p.clues.length) p.clues = autoClues(p);
    lv.revealed = false;
    lv.clueAt = NOW() + (chained ? fxDur(S.fx) : 0) + FXD.mystery + 1200;
    log({ type: 'mystery', pid: p.id, note: 'mystery player on the block' });
    fire('mystery', { pid: p.id }, true);
  }
  if (!SIM) {
    const fx = S.fx;
    const delay = fx && fx.then && fx.then.kind === kind ? Math.max(0, fxDur(fx) - (Date.now() - fx.at)) : 0;
    setTimeout(() => (kind === 'wild' ? SFX.wild() : SFX.mystery()), delay);
  }
}

/* The curtain: a new player stays off the projector (which keeps showing the last result)
   until the auctioneer shows them. lv.shown === false means hidden; older saves have no flag. */
const onCurtain = () => S.live.phase === 'ready' && S.live.shown === false;
function showOnProjector() {
  if (!onCurtain()) return false;
  commit(() => {
    S.live.shown = true;
    if (S.live.setFx) { fire('set', { setId: S.live.setFx, pid: S.live.pid }); S.live.setFx = null; }
  });
  SFX.alert();
  return true;
}
function startBidding() {
  const lv = S.live, p = lotPlayer();
  if (!p || lv.phase !== 'ready') return false;
  if (lv.shown === false) return showOnProjector();
  if (isHiddenNow(p) && S.rules.mystery.reveal === 'before') { toast('Reveal the mystery player first (press M).', 'warn'); return false; }
  commit(() => { lv.phase = 'bidding'; lv.startedAt = NOW(); lv.call = 0; lv.shown = true; log({ type: 'start', pid: p.id }); });
  return true;
}

function placeBid(tid, amt, o = {}) {
  const lv = S.live, p = lotPlayer();
  if (!p || lv.phase === 'empty' || lv.phase === 'done') { toast('No player on the block. Press N for the next player.', 'warn'); return false; }
  if (lv.phase === 'ready' && isHiddenNow(p) && S.rules.mystery.reveal === 'before') { toast('Reveal the mystery player first (press M).', 'warn'); return false; }
  if (amt == null) amt = nextAmount();
  const ch = checkBid(tid, amt, p);
  if (ch.hard.length) {
    if (!SIM) { toast(T(tid).name + ': ' + ch.hard[0], 'bad'); SFX.no(); shakeChip(tid); }
    return false;
  }
  commit(() => {
    if (lv.phase === 'ready') { lv.phase = 'bidding'; lv.startedAt = NOW(); log({ type: 'start', pid: p.id }); }

    lv.setFx = null;

    lv.bids.push({ tid, amt, t: NOW(), lid: e.id });

    lv.passed = lv.passed.filter(x => x !== tid);

  if (!SIM) {
    SFX.bid(); bumpAmount();

    checkAllOut();

}
const bidTeam = tid => placeBid(tid, nextAmount());
function spaceBid() {
  const lv = S.live;

  if (lv.phase === 'ready') return startBidding();
  const c = findChallenger();
  if (!c) return toast('Tap the team that raised its paddle, or press its number key.', 'info');
  placeBid(c, nextAmount());
}
function setJump(l) {
  if (!lead()) return toast('The opening bid is always the base price.', 'info');
  commit(() => { S.live.jump = S.live.jump === l ? null : l; });
}
function checkAllOut() {
  const lv = S.live, p = lotPlayer();
  if (!p || lv.phase !== 'bidding') return;
  const l = lead();
  const amt = nextAmount();
  const left = S.teams.filter(t => !checkBid(t.id, amt, p).hard.length);
  if (l && !left.length) toast(`No other team can bid. Press S to sell to ${T(l.tid).name}.`, 'good');
  else if (!l && !left.length) toast('No team can bid on this player. Press U for unsold.', 'warn');
}
function togglePass(tid) {
  const lv = S.live;
  if (!lv.pid || lv.phase === 'done' || lv.phase === 'empty') return;
  const on = !lv.passed.includes(tid);
  commit(() => {
    lv.passed = on ? lv.passed.concat(tid) : lv.passed.filter(x => x !== tid);
    log({ type: 'pass', pid: lv.pid, tid, note: on ? 'passed' : 'back in the bidding' });

}
function undoBid() {
  const lv = S.live;
  const b = lv.bids[lv.bids.length - 1];
  if (!b) return;
  commit(() => {
    lv.bids.pop();
    const e = S.log.find(x => x.id === b.lid);
    if (e) e.voided = true;
    log({ type: 'undo', pid: lv.pid, tid: b.tid, amt: b.amt, note: `Bid removed: ${T(b.tid).short} ${money(b.amt)}` });
    lv.jump = null;
    lv.call = 0;

}
function lastUndoable() { for (let i = CK.length - 1; i >= 0; i--) if (!CK[i].fwd) return CK[i]; return null; }
function undoKey() {
  const lv = S.live;
  if (lv.phase === 'bidding' && lv.bids.length) return undoBid();

  confirmBox({
    title: '↶ UNDO', tone: 'blue',
    html: `<p>Undo <b>${esc(ck.label)}</b> from ${hhmm(ck.t)}?</p><p class="muted">The auction goes back to how it was just before. The feed keeps a record of what was undone.</p>`,
    ok: 'UNDO', okClass: 'blue', onOk: () => restoreCK(ck.id, 'undo'),

}
function fixLastBidTeam(tid) {
  const lv = S.live, b = lv.bids[lv.bids.length - 1], p = lotPlayer();
  if (!b || b.tid === tid) return;
  const prev = lv.bids[lv.bids.length - 2];
  if (prev && prev.tid === tid) return toast(T(tid).name + ' made the previous bid. Undo instead.', 'warn');
  const saved = lv.bids.pop();

/* ---------- Sold / unsold ---------- */
function askSold() {
  const lv = S.live, p = lotPlayer();
  if (!p || lv.phase === 'empty' || lv.phase === 'done') return toast('No player on the block.', 'warn');
  const l = lead();
  if (!l) return toast('No bids yet. Press U to mark this player unsold.', 'warn');

function sell(tid, amt, acq = 'auction', note = '') {

    S.lots.push({ lotId: lv.lotId, pid: p.id, result: 'unsold', bids: lv.bids.length, t: NOW(), how: lv.how });

/* ---------- RTM ---------- */
function rtmKey() {

  if (!l) return toast('RTM needs a bid to match.', 'info');

  if (p.prevTeam && T(p.prevTeam) && p.prevTeam !== l.tid) return openRTM(p.prevTeam, 'offer');

}
function rtmSell(rtid, amt) { sell(rtid, amt, 'rtm', 'Right to Match'); }
function rtmDeclined(rtid) { commit(() => log({ type: 'rtm_decline', pid: S.live.pid, tid: rtid, note: 'declined RTM' })); }

/* ---------- Mystery (players arrive on their own; clues and the reveal can run by themselves) ---------- */
function mysteryKey(shift) {
  const p = lotPlayer();
  if (p && isHiddenNow(p) && S.live.phase !== 'done') {
    if (shift || S.live.clues >= (p.clues || []).length) return revealMystery();
    return showClue();
  }
  toast('Mystery players pop up on their own during the auction.', 'info');
}
function showClue() {
  const p = lotPlayer();
  if (!p) return;
  const n = S.live.clues, c = (p.clues || [])[n];
  if (!c) return revealMystery();
  commit(() => {
    S.live.clues = n + 1;
    S.live.clueAt = NOW() + (S.rules.mystery.every || 6) * 1000;
    log({ type: 'clue', pid: p.id, note: '#' + (n + 1) + ' ' + c });
    fire('clue', { pid: p.id, n: n + 1, text: c });
  });

}
function revealMystery() {
  const p = lotPlayer();

  commit(() => {
    S.live.revealed = true; p.revealed = true; S.live.clueAt = null;
    log({ type: 'reveal', pid: p.id, note: p.name });
    fire('reveal', { pid: p.id });

/* Runs four times a second in the control window: shows the next clue, then reveals. */
function autoTick() {

/* ---------- Queue ---------- */
function qMove(pid, d) {
  commit(() => {
    const q = S.queue, i = q.indexOf(pid), j = i + d;
    if (i < 0 || j < 0 || j >= q.length) return;
    [q[i], q[j]] = [q[j], q[i]];

}
function qRemove(pid) { commit(() => { S.queue = S.queue.filter(x => x !== pid); }); toast('Removed from the queue. The player is still available.', 'info'); }
function qToEnd(pid) { commit(() => { S.queue = S.queue.filter(x => x !== pid).concat(pid); }); }
function qDrop(pid, target, before) {
  if (pid === target) return;
  commit(() => {
    const q = S.queue.filter(x => x !== pid);
    let j = q.indexOf(target);
    if (j < 0) j = q.length; else if (!before) j++;

    S.queue = q;
  });
}
function qAdd(pid, where) {
  const p = P(pid);

  if (p.status === 'sold') return toast(`${p.name} is already sold.`, 'warn');
  if (p.status === 'withdrawn') return toast(`${p.name} is withdrawn. Restore the player first.`, 'warn');
  if (S.live.pid === p.id && S.live.phase !== 'done') return toast(`${p.name} is on the block right now.`, 'info');
  if (inSurprisePool(p)) return toast('Mystery and wild card players enter the auction by surprise.', 'info');
  commit(() => {
    if (p.status === 'unsold') { p.status = 'available'; p.pool = false; log({ type: 'unsold_round', pid, note: `${p.name} back in the auction` }); }
    S.queue = S.queue.filter(x => x !== pid);
    if (where === 'next') S.queue.unshift(pid); else S.queue.push(pid);

  const from = T(p.soldTo).short;
  commit(() => {
    p.soldTo = tid; if (p.acq === 'rtm') p.acq = 'auction';
    log({ type: 'correction', pid, tid, amt: p.soldPrice, note: `${p.name}: team ${from} → ${T(tid).short}${why(reason)}` });
  }, { ck: `Correction: ${p.name} team` });
  toast('Team corrected and purses recalculated.', 'good');
}
function corrPrice(pid, amt, reason) {
  const p = P(pid); if (!p || p.status !== 'sold' || amt == null || amt < 0) return;
  const old = p.soldPrice;
  commit(() => {
    p.soldPrice = amt;
    log({ type: 'correction', pid, tid: p.soldTo, amt, note: `${p.name}: price ${money(old)} → ${money(amt)}${why(reason)}` });
  }, { ck: `Correction: ${p.name} price` });
  toast('Price corrected and purse recalculated.', 'good');
}
function refund(p) { Object.assign(p, { soldTo: '', soldPrice: null, acq: '', soldAt: null }); }
function corrReauction(pid, reason) {
  const p = P(pid); if (!p) return;

  const was = p.status === 'sold' ? `${T(p.soldTo).short} ${money(p.soldPrice)}` : p.status;
  commit(() => {
    refund(p); p.status = 'available'; p.pool = false;
    S.queue = [pid].concat(S.queue.filter(x => x !== pid));

}
function corrToPool(pid, reason) {
  const p = P(pid); if (!p) return;
  if (S.live.pid === pid && S.live.phase === 'bidding' && S.live.bids.length) return toast('Finish the current bidding first.', 'warn');
  const was = p.status === 'sold' ? `${T(p.soldTo).short} ${money(p.soldPrice)}` : p.status;

}

/* RTM: offer → (optional final raise → match) → sale */
function openRTM(tid, step) { UI.rtm = { tid, step, raise: null }; drawRTM(); }
function drawRTM() {
  const r = UI.rtm, p = lotPlayer(), l = lead();
  if (!r || !p || !l) return closeModal();
  const lt = T(l.tid);
  let body = '', foot = '', keys = {}, onEnter = null;
  if (r.step === 'pick') {
    body = `<p>Which team holds the Right to Match for <b>${esc(publicName(p))}</b>?</p><div class="pick-grid">${S.teams.filter(t => t.id !== l.tid).map(t => `<button class="chip" data-act="rtm-pick" data-team="${t.id}" style="--tc:${esc(t.color)}"><span class="c-short">${esc(t.short)}</span><span class="c-purse">RTM left: ${D().ti[t.id].rtmLeft}</span></button>`).join('')}</div>`;
    foot = `<button class="btn ghost" data-act="modal-close">CANCEL <kbd>Esc</kbd></button>`;
  } else if (r.step === 'offer') {
    const ot = T(r.tid), oti = D().ti[r.tid];
    const ch = checkBid(r.tid, l.amt, p, { rtm: true });
    const block = oti.rtmLeft <= 0 ? 'No RTM cards left.' : ch.hard[0];
    body = `<div class="sale-grid">
        <div><span>ORIGINAL TEAM</span><b>${teamBadge(r.tid)}</b></div>
        <div><span>CURRENT BID</span><b class="big">${money(l.amt, { fixed: true })}</b></div>
        <div><span>HIGHEST BIDDER</span><b>${teamBadge(l.tid)}</b></div>
        <div><span>RTM CARDS</span><b>${oti.rtmLeft} of ${S.rules.rtmCount} left</b></div>
      </div>
      ${block ? `<div class="notice bad">${esc(ot.name)} cannot use RTM: ${esc(block)}</div>` : `<p>Ask <b>${esc(ot.name)}</b>: match ${money(l.amt)} to keep ${esc(publicName(p))}?</p>`}`;
    foot = `<button class="btn ghost" data-act="rtm-decline">DECLINE <kbd>N</kbd></button><button class="btn blue lg" data-act="rtm-use" ${block ? 'disabled' : ''}>USE RTM <kbd>Y</kbd></button>`;
    keys = { n: rtmDecline, y: () => { if (!block) rtmUse(); } };
  } else if (r.step === 'raise') {
    body = `<p><b>${esc(T(r.tid).name)}</b> wants to use RTM. <b>${esc(lt.name)}</b> may make one final raise.</p>
      <label class="f"><span>Final raise (${esc(S.rules.currency.unit || 'amount')})</span><input id="rtmRaise" type="number" step="0.05" min="${crVal(l.amt)}" value="${crVal(l.amt + autoStep(l.amt))}" autofocus></label>`;
    foot = `<button class="btn ghost" data-act="rtm-noraise">NO RAISE · RTM AT ${money(l.amt)}</button><button class="btn gold" data-act="rtm-raise">RAISE <kbd>Enter</kbd></button>`;
    onEnter = rtmRaise;
  } else if (r.step === 'match') {
    body = `<div class="sale-grid"><div><span>FINAL RAISE</span><b class="big">${money(r.raise, { fixed: true })}</b></div><div><span>BY</span><b>${teamBadge(l.tid)}</b></div></div><p>Does <b>${esc(T(r.tid).name)}</b> match ${money(r.raise)}?</p>`;
    foot = `<button class="btn ghost" data-act="rtm-nomatch">NO · SOLD TO ${esc(lt.short)} <kbd>N</kbd></button><button class="btn blue lg" data-act="rtm-match">MATCH <kbd>Y</kbd></button>`;
    keys = { y: () => rtmMatch(true), n: () => rtmMatch(false) };
  }
  openModal({ id: 'rtm', tone: 'blue', title: '🔁 RIGHT TO MATCH', body, foot, keys, onEnter });
}
function rtmUse() {
  const r = UI.rtm, l = lead();
  if (!r || !l) return;
  if (S.rules.rtmRaise) { r.step = 'raise'; return drawRTM(); }
  closeModal();
  rtmSell(r.tid, l.amt);
}
function rtmDecline() {
  const r = UI.rtm;
  if (r && r.tid) rtmDeclined(r.tid);
  closeModal();
  openConfirmSale();
}
function rtmRaise() {
  const r = UI.rtm, l = lead(), p = lotPlayer();
  const amt = cr2l(($('#rtmRaise') || {}).value);
  if (!(amt > l.amt)) return toast('The raise must be more than ' + money(l.amt) + '.', 'warn');
  const saved = S.live.bids.pop();
  const ch = checkBid(l.tid, amt, p, { rtm: true });
  S.live.bids.push(saved);
  if (ch.hard.length) return toast(T(l.tid).name + ': ' + ch.hard[0], 'bad');
  rtmRaiseBid(amt);
  r.raise = amt; r.step = 'match';
  drawRTM();
}
function rtmMatch(yes) {
  const r = UI.rtm, l = lead(), p = lotPlayer();
  if (!r || !l) return;
  if (yes) {
    const ch = checkBid(r.tid, r.raise, p, { rtm: true });
    if (ch.hard.length) return toast(T(r.tid).name + ': ' + ch.hard[0], 'bad');
    closeModal(); rtmSell(r.tid, r.raise);
  } else { rtmDeclined(r.tid); closeModal(); sell(l.tid, r.raise, 'auction', 'after RTM raise'); }
}

/* ---------- Surprise picker: the handler chooses or changes the mystery / wild card player ---------- */
/* 'swap' while a surprise player is on the block with no bids yet, otherwise 'next' */
function surpriseMode() {
  const lv = S.live;
  return lv.how === 'surprise' && lv.pid && (lv.phase === 'ready' || lv.phase === 'bidding') && !lv.bids.length ? 'swap' : 'next';
}
function openSurprisePick() {
  openModal({
    id: 'surp', tone: 'purple', title: '🎲 SURPRISE PLAYER', wide: true, live: drawSurprisePick,
    body: `<p id="spIntro"></p><input type="search" id="spQ" placeholder="Search the pool, or any available player to make them a surprise" data-in="sp" aria-label="Search players"><div id="spList" style="max-height:48vh;overflow:auto"></div>`,
    foot: `<button class="btn ghost" data-act="modal-close">CLOSE <kbd>Esc</kbd></button><button class="btn ghost" data-act="sp-random">🎲 RANDOM PICK</button><button class="btn gold" data-act="sp-pop" id="spPop">POP IN NOW</button>`,
  });
  drawSurprisePick();
}
/* Slots left for a kind; while swapping, the player on the block gives its slot back. */
function surpriseSlots(kind) {
  const cp = surpriseMode() === 'swap' ? lotPlayer() : null;
  const back = cp && (cp.wild ? 'wild' : 'mystery') === kind ? 1 : 0;
  return surpriseMax(kind) - (S.surprise.n[kind] || 0) + back;
}
function drawSurprisePick() {
  const el = $('#spList'); if (!el) return;
  const swap = surpriseMode() === 'swap', cur = swap ? lotPlayer() : null, nx = surpriseNext();
  const q = ($('#spQ') || {}).value || '';
  const intro = $('#spIntro');
  if (intro) intro.innerHTML = swap
    ? `On the block now: <b>${cur.wild ? '🃏' : '🕵️'} ${esc(cur.name)}</b>. Pick another player to swap in. ${esc(cur.name)} goes back to the surprise pool.`
    : `Pops in next: <b>${nx ? (nx.kind === 'wild' ? '🃏 ' : '🕵️ ') + esc(nx.p.name) + (nx.manual ? ' (your pick)' : ' (random pick)') : 'nobody, the pool is empty'}</b>. Pick a player to change it, or press <b>POP IN NOW</b>.`;
  const pop = $('#spPop'); if (pop) pop.hidden = swap;
  const pool = S.players.filter(p => p.status === 'available' && (p.mystery || p.wild) && !p.surprised && S.live.pid !== p.id);
  const others = q.trim() ? S.players.filter(p => p.status === 'available' && !pool.includes(p) && S.live.pid !== p.id) : [];
  const list = pool.filter(psearch(q)).sort((a, b) => (b.wild - a.wild) || b.rating - a.rating).concat(others.filter(psearch(q)).slice(0, 60));
  const okM = surpriseSlots('mystery') > 0, okW = surpriseSlots('wild') > 0;
  const btn = (p, kind, ok) => {
    const on = nx && !swap && nx.p.id === p.id && nx.kind === kind;
    const tag = kind === 'wild' ? '🃏 WILD CARD' : '🕵️ MYSTERY';
    return `<button class="mini${on ? ' on' : ''}" data-act="sp-pick" data-pid="${esc(p.id)}" data-kind="${kind}" ${ok ? '' : 'disabled title="No ' + (kind === 'wild' ? 'wild card' : 'mystery') + ' slots left. Raise the limit in Setup → Surprises."'}>${on ? '✓ ' : ''}${tag}</button>`;
  };
  const row = p => `<tr class="${nx && !swap && nx.p.id === p.id ? 'sp-on' : ''}"><td class="pid">${p.wild ? '🃏 ' + esc(p.wcode || 'WILD') : p.mystery ? '🕵️ ' + esc(p.mcode || 'M-?') : '#' + esc(pnum(p))}</td><td class="pname">${esc(p.name)}</td><td>${roleText(p)}</td><td class="r">${esc(p.rating)}</td><td class="r money">${money(p.base)}</td><td class="r"><div class="acts">${btn(p, 'mystery', okM)}${btn(p, 'wild', okW)}</div></td></tr>`;
  patch(el, list.length
    ? `<table class="tbl"><thead><tr><th>Code</th><th>Player</th><th>Role</th><th class="r">Rating</th><th class="r">Base</th><th class="r">Use as</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table>${!q.trim() ? '<p class="muted" style="margin-top:8px">These are the players waiting in the surprise pool. Search to turn any other available player into a mystery or wild card.</p>' : ''}`
    : `<p class="muted">${q.trim() ? 'No available player matches.' : 'The surprise pool is empty. Search for any available player to make them a mystery or wild card.'}</p>`);
}
function makeSurprise(p, kind) {
  if (kind === 'wild') { p.wild = true; p.mystery = false; if (!p.wcode) p.wcode = nextCode('WC-', 'wcode'); }
  else { p.mystery = true; p.wild = false; if (!p.mcode) p.mcode = nextCode('M-', 'mcode'); if (!p.clues || !p.clues.length) p.clues = autoClues(p); }
  p.surprised = false; p.revealed = false;
  S.queue = S.queue.filter(x => x !== p.id);
}
/* Swap the surprise player on the block (no bids yet) for another one. */
function swapSurprise(np, kind) {
  const old = lotPlayer(), oldKind = old.wild ? 'wild' : 'mystery', gap = S.surprise.gap;
  old.surprised = false; old.revealed = false; old.wildAt = null;
  S.wildUsed = S.wildUsed.filter(x => x !== old.id);
  S.surprise.n[oldKind] = Math.max(0, (S.surprise.n[oldKind] || 0) - 1);
  log({ type: 'correction', pid: old.id, note: `Surprise changed: ${old.name} → ${np.name} (${kind === 'wild' ? 'wild card' : 'mystery'})` });
  loadSurprise(np, kind);
  S.surprise.gap = gap;
}
function pickSurprisePlayer(pid, kind) {
  const p = P(pid);
  if (!p || p.status !== 'available') return toast('That player is not available.', 'warn');
  if (surpriseSlots(kind) <= 0) return toast(`No ${kind === 'wild' ? 'wild card' : 'mystery'} slots left. Raise the limit in Setup → Surprises.`, 'warn');
  const swap = surpriseMode() === 'swap';
  commit(() => {
    makeSurprise(p, kind);
    if (swap) swapSurprise(p, kind);
    else S.surprise.next = { kind, pid: p.id, manual: true };
  });
  if (swap) { closeModal(); toast(`${p.name} is now the ${kind === 'wild' ? 'wild card' : 'mystery player'} on the block.`, 'good'); }
  else toast(`${p.name} pops in next as a ${kind === 'wild' ? 'wild card' : 'mystery player'}.`, 'good');
}
function randomSurprise() {
  if (surpriseMode() === 'swap') {
    const pick = pickSurprise();
    if (!pick) return toast('No other mystery or wild card players in the pool.', 'warn');
    return pickSurprisePlayer(pick.p.id, pick.kind);
  }
  const was = surpriseNext();
  commit(() => rollNextSurprise(was && was.p.id));
  const nx = surpriseNext();
  toast(nx ? `Random pick: ${nx.p.name} (${nx.kind === 'wild' ? 'wild card' : 'mystery'}).` : 'The surprise pool is empty.', nx ? 'good' : 'warn');
}
/* Pop the next surprise onto the block right now. */
function popSurpriseNow() {
  const lv = S.live;
  if (surpriseMode() === 'swap') return toast('A surprise player is already on the block.', 'info');
  if (lv.phase === 'bidding' && lv.bids.length) return toast('Finish bidding on the current player first (S or U).', 'warn');
  if (!surpriseNext()) commit(() => rollNextSurprise());
  const pick = surpriseNext();
  if (!pick) return toast('No mystery or wild card players left in the pool.', 'warn');
  closeModal();
  commit(() => {
    const cur = lotPlayer();
    if (cur && cur.status === 'available' && lv.phase !== 'done') S.queue.unshift(cur.id);
    log({ type: 'correction', pid: pick.p.id, note: 'Surprise popped in by the auctioneer' });
    loadSurprise(pick.p, pick.kind);
  });
  nav('control');
}

function nextPlayerId() {
  let n = 0;
  S.players.forEach(p => { const m = String(p.id).match(/(\d+)/); if (m) n = Math.max(n, +m[1]); });
  return 'P' + String(n + 1).padStart(3, '0');
}
function nextCode(prefix, field) {
  let n = 0;
  S.players.forEach(p => { const m = String(p[field] || '').match(/(\d+)/); if (m) n = Math.max(n, +m[1]); });
  return prefix + String(n + 1).padStart(2, '0');
}
function savePlayerEditor() {
  const v = id => ($('#' + id) || {}).value;
  const name = String(v('peName') || '').trim();
  const id = String(v('peId') || '').trim();
  if (!name) return toast('Enter the player name.', 'warn');
  if (!id) return toast('Enter a player ID.', 'warn');
  const orig = UI.pe.orig;
  if (S.players.some(p => p.id === id && p.id !== orig)) return toast('Another player already has ID ' + id + '.', 'warn');
  const kind = v('peKind');
  const extra = String(v('peTagX') || '').split(',').map(s => s.trim()).filter(Boolean);
  const data = {
    id, name, role: v('peRole'), bat: v('peBat'), bowl: String(v('peBowl') || '').trim(), rating: clamp(parseInt(v('peRating'), 10) || 0, 0, 100),
    base: Math.max(0, cr2l(v('peBase') || 0)), category: v('peCat'), overseas: v('peOs') === '1', setId: v('peSet'), prevTeam: v('pePrev'),
    tags: UI.pe.tags.concat(extra.filter(t => !UI.pe.tags.includes(t))), photo: UI.pe.photo || '',
    mystery: kind === 'mystery', wild: kind === 'wild',
  };
  data.bowlKind = bowlKindOf(data.bowl);
  if (data.mystery) { data.mcode = String(v('peMcode') || '').trim() || nextCode('M-', 'mcode'); data.clues = String(v('peClues') || '').split('\n').map(s => s.trim()).filter(Boolean); }
  if (data.wild) data.wcode = String(v('peWcode') || '').trim() || nextCode('WC-', 'wcode');
  commit(() => {
    if (orig) {
      const p = S.players.find(x => x.id === orig);
      if (orig !== id) {
        S.queue = S.queue.map(x => (x === orig ? id : x));
        if (S.live.pid === orig) S.live.pid = id;
        S.log.forEach(e => { if (e.pid === orig) e.pid = id; });
        S.lots.forEach(l => { if (l.pid === orig) l.pid = id; });
        S.wildUsed = S.wildUsed.map(x => (x === orig ? id : x));
      }
      Object.assign(p, data);
      if (data.wild) S.queue = S.queue.filter(x => x !== id || S.wildUsed.includes(id));
    } else {
      S.players.push(newPlayer(data));
      if (!data.wild) S.queue.push(id);
    }
  });
  closeModal();
  toast(orig ? 'Player saved.' : name + ' added' + (data.wild ? ' as a wild card.' : ' and queued.'), 'good');
}

/* ---------- Judging & fun awards ---------- */
function judgeTotals(jid, tid) {
  const sc = ((S.judging.scores[jid] || {})[tid]) || {};
  const vals = CRIT.map(([k]) => sc[k]);
  const filled = vals.filter(v => v !== undefined && v !== '' && v !== null).length;
  return { total: Math.round(sum(vals) * 10) / 10, filled, complete: filled === CRIT.length };
}
function standings() {
  const js = S.judging.judges;
  return S.teams.map(t => {
    const per = js.map(j => judgeTotals(j.id, t.id));
    const scored = per.filter(x => x.filled);
    const avg = scored.length ? Math.round(sum(scored.map(x => x.total)) / scored.length * 10) / 10 : null;
    return { t, per, avg, complete: per.every(x => x.complete) };
  }).sort((a, b) => (b.avg ?? -1) - (a.avg ?? -1));
}
const AWARDS = [['champions', '🏆 Auction Champions'], ['value', '💎 Best Value Buy'], ['war', '🔥 Biggest Bidding War'], ['mystery', '🕵️ Best Mystery Player'], ['wild', '🃏 Best Wild Card'], ['purchase', '💰 Biggest Purchase'], ['funny', '😂 Funniest Purchase'], ['destroyer', '💀 Purse Destroyer'], ['bargain', '🤑 Biggest Bargain']];
function awardSuggestion(k) {
  const st = D().st, sold = S.players.filter(p => p.status === 'sold');
  const best = list => list.sort((a, b) => b.rating - a.rating)[0];
  switch (k) {
    case 'champions': { const s = standings()[0]; return s && s.avg != null ? { tid: s.t.id, note: `Top of the judges' table with ${s.avg} / 100` } : null; }
    case 'value': return st.bargain ? { tid: st.bargain.p.soldTo, pid: st.bargain.p.id, note: `${money(st.bargain.p.soldPrice)} for a player rated ${st.bargain.p.rating}` } : null;
    case 'war': { const w = st.war, p = w && P(w.pid); return p ? { tid: p.soldTo || (w.top[0] || ''), pid: p.id, note: plural(w.n, 'bid') } : null; }
    case 'mystery': { const p = best(sold.filter(x => x.mystery)); return p ? { tid: p.soldTo, pid: p.id, note: `Rated ${p.rating}, bought for ${money(p.soldPrice)}` } : null; }
    case 'wild': { const p = best(sold.filter(x => x.wild)); return p ? { tid: p.soldTo, pid: p.id, note: `Rated ${p.rating}, bought for ${money(p.soldPrice)}` } : null; }
    case 'purchase': return st.most ? { tid: st.most.soldTo, pid: st.most.id, note: money(st.most.soldPrice) } : null;
    case 'destroyer': return st.mostSpent && st.mostSpent.spent ? { tid: st.mostSpent.t.id, note: `Spent ${money(st.mostSpent.spent)}` } : null;
    case 'bargain': { const p = sold.filter(x => x.soldPrice <= x.base * 1.1).sort((a, b) => b.rating - a.rating || a.soldPrice - b.soldPrice)[0]; return p ? { tid: p.soldTo, pid: p.id, note: `Rated ${p.rating}, went at base price ${money(p.soldPrice)}` } : null; }
  }
  return null;
}

/* ================= Setup ================= */
function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, v) { const ks = path.split('.'); const last = ks.pop(); const tgt = ks.reduce((a, k) => a[k], o); tgt[last] = v; }
function fld(label, path, t, o = {}) {
  const v = getPath(S, path);
  const hint = o.hint ? ` <small>${o.hint}</small>` : '';
  if (t === 'bool') return `<label class="check"><input type="checkbox" data-bind="${path}" data-t="bool" ${v ? 'checked' : ''}> ${label}</label>`;
  if (t === 'select') return `<label class="f"><span>${label}${hint}</span><select data-bind="${path}" data-t="${o.vt || 'str'}">${o.opts.map(([k, l]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  const val = t === 'money' ? crVal(v) : (v ?? '');
  const num = t !== 'str';
  return `<label class="f"><span>${label}${hint}</span><input type="${num ? 'number' : 'text'}"${num ? ` step="${t === 'money' ? '0.05' : '1'}"${o.min != null ? ` min="${o.min}"` : ''}${o.max != null ? ` max="${o.max}"` : ''}` : ''} data-bind="${path}" data-t="${t}" value="${esc(val)}"></label>`;
}
function bindChange(el) {
  const path = el.dataset.bind, t = el.dataset.t;
  let v;
  if (t === 'bool') v = el.checked;
  else if (t === 'money') { v = el.value === '' ? null : cr2l(el.value); if (v == null || v < 0) { toast('Enter an amount of 0 or more.', 'warn'); return PAGES.setup.build(); } }
  else if (t === 'int') { v = parseInt(el.value, 10); if (!isFinite(v) || v < 0) { toast('Enter a whole number.', 'warn'); return PAGES.setup.build(); } }
  else v = el.value;
  if (path === 'rules.minSquad' && v > S.rules.maxSquad) return toast('Minimum squad cannot be more than the maximum squad.', 'warn');
  if (path === 'rules.maxSquad' && v < S.rules.minSquad) return toast('Maximum squad cannot be less than the minimum squad.', 'warn');
  commit(() => {
    setPath(S, path, v);
    if (path.startsWith('rules.surprise.')) { const R = S.rules.surprise; S.surprise.gap = clamp(S.surprise.gap, Math.min(R.min, R.max), Math.max(R.min, R.max)); }
    if (path === 'rules.order') rebuildQueue();
  });
  if (path === 'rules.order') toast(v === 'queue' ? 'Queue rebuilt in set order.' : 'Queue reshuffled.', 'good');
  if (path.startsWith('rules.currency') || path.startsWith('rules.surprise') || path === 'rules.mystery.auto' || path === 'rules.wild.when' || path === 'rules.wild.specialBase' || path === 'rules.mystery.hide') PAGES.setup.build();
}

/* ---------- Setup actions ---------- */
function setTeamCount(n) {
  n = clamp(n, 2, 15);
  if (n === S.teams.length) return;
  if (n < S.teams.length) {
    const drop = S.teams.slice(n);
    const busy = drop.find(t => S.players.some(p => p.soldTo === t.id) || S.live.bids.some(b => b.tid === t.id));
    if (busy) return toast(`${busy.name} has players or bids. Clear them before removing the team.`, 'warn');
    commit(() => {
      const ids = drop.map(t => t.id);
      S.teams = S.teams.slice(0, n);
      S.players.forEach(p => { if (ids.includes(p.prevTeam)) p.prevTeam = ''; });
      S.live.passed = S.live.passed.filter(x => !ids.includes(x));
    });
  } else commit(() => { while (S.teams.length < n) S.teams.push(newTeam(S.teams.length)); });
  PAGES.setup.build();
}

/* One-shot animations for whatever changed since the last projector render. */
const PJA = { scene: null, amt: null, lead: null, feed: null, purse: {}, t: 0 };
function projAnimate() {
  const main = $('#pjMain'); if (!main) return;
  const lv = S.live, l = lead(), p = lotPlayer();
  const scene = !p || lv.phase === 'empty' ? 'idle' : onCurtain() ? 'curtain:' + lv.lotId : 'lot:' + lv.lotId + (lv.phase === 'done' ? ':done' : '') + (isHiddenNow(p) ? ':h' : '');
  const amt = l ? l.amt : null, tid = l ? l.tid : null;
  if (scene !== PJA.scene) {
    const first = PJA.scene === null;
    PJA.scene = scene;
    if (!first) {
      // wait for a full-screen effect (SOLD!, wild card…) to finish so the entrance is actually seen
      clearTimeout(PJA.t);
      main.classList.remove('enter');
      main.classList.add('wait');
      const go = () => {
        if (fxLeft() > 0) { PJA.t = setTimeout(go, 150); return; }
        main.classList.remove('wait'); void main.offsetWidth; main.classList.add('enter');
        countUp(main.querySelectorAll('.pj-stats .ps-row b'), 800);
        PJA.t = setTimeout(() => main.classList.remove('enter'), 1900);
      };
      go();
    }
  } else {
    if (amt !== PJA.amt && amt != null) { const el = $('#pjAmt'); if (el) el.classList.add('bump'); }
    if (tid && tid !== PJA.lead) { const t = main.querySelector('.pj-team'); if (t) t.classList.add('flash'); }
  }
  PJA.amt = amt; PJA.lead = tid;
  const li = $('#pjFeed li');
  if (li) { const k = li.textContent; if (PJA.feed !== null && k !== PJA.feed) li.classList.add('new'); PJA.feed = k; }
  const d = D(), tiles = $$('#pjPurses .pp');
  S.teams.forEach((t, i) => {

  });
}
/* Milliseconds until the current full-screen effect (and any queued one) is over. */
function fxLeft() {
  const fx = S.fx;
  if (!fx || fx.dismissed) return 0;
  return Math.max(0, fx.at + fxDur(fx) + (fx.then ? fxDur(fx.then) : 0) - Date.now());
}
/* Count numbers like "4,598" or "40.3" up from zero, ending on exactly the original text. */
function countUp(els, ms) {
  els.forEach(el => {
    const txt = el.textContent, m = txt.match(/^(\d{1,3}(?:,\d{2,3})*|\d+)(\.\d+)?$/);
    if (!m) return;
    const dec = m[2] ? m[2].length - 1 : 0, end = parseFloat(txt.replace(/,/g, '')), t0 = performance.now();
    const fmt = v => (txt.includes(',') ? v.toLocaleString('en-IN', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec));
    const step = now => {
      if (!el.isConnected) return;
      const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = k < 1 ? fmt(end * e) : txt;
      if (k < 1) requestAnimationFrame(step);
    };
    el.textContent = fmt(0);
    requestAnimationFrame(step);
  });
}

function runFx(el, big) {
  if (!el || !S) return;
  const fx = S.fx;
  if (!fx || fx.dismissed) { if (el.classList.contains('on')) hideFx(el); if (fx) el._seq = fx.seq; return; }
  if (el._seq === fx.seq) return;
  el._seq = fx.seq;
  const now = Date.now();
  let start = fx.at, cur = fx;
  const d1 = fxDur(fx);
  if (now - start > d1 && fx.then) { start += d1; cur = fx.then; }
  const left = fxDur(cur) - (now - start);
  if (left < 250) return;
  showFx(el, cur, big, left, cur === fx ? fx.then : null);
}
function showFx(el, fx, big, ms, then) {
  el.innerHTML = fxHTML(fx, big);
  el.className = (big ? 'pj-fx' : 'cr-fx') + ' on' + (fx.kind === 'alert' && big ? ' fx-alert-wrap' : '');
  if (fx.kind === 'reveal' || (fx.kind === 'sold' && fx.data && fx.data.reveal)) scramble(el, fx.kind === 'sold' ? 150 : 250);
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (then && S.fx && !S.fx.dismissed) showFx(el, then, big, fxDur(then), null); else hideFx(el); }, ms);
}
function hideFx(el) {
  clearTimeout(el._t);
  el.classList.remove('on');
  setTimeout(() => { if (!el.classList.contains('on')) el.innerHTML = ''; }, 300);
}
function scramble(root, delay) {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-scramble]').forEach(el => {
    const target = el.dataset.scramble;
    if (reduce) { el.textContent = target; return; }
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#?%&@';
    const t0 = performance.now() + delay, dur = 1300;
    const step = now => {
      const k = clamp((now - t0) / dur, 0, 1), n = Math.floor(k * target.length);
      let s = target.slice(0, n);
      for (let i = n; i < target.length; i++) s += target[i] === ' ' ? ' ' : chars[Math.floor(Math.random() * chars.length)];
      el.textContent = s;
      if (k < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = target;
    };
    requestAnimationFrame(step);
  });
}

function tagFromText(s) {

}
function rowsToPlayers(rows) {
  const head = rows[0].map(normKey), map = {};
  for (const [f, al] of Object.entries(COLS)) { const i = head.findIndex(h => al.includes(h)); if (i >= 0) map[f] = i; }
  const out = [], warn = [];
  if (map.name == null) return { out, warn: ['No “Name” column was found. Check that the first row has column names.'], map };
  const lakhCol = map.base != null && /(l|lakh|lakhs)$/.test(head[map.base]);
  let n = 0;
  S.players.forEach(p => { const m = String(p.id).match(/(\d+)/); if (m) n = Math.max(n, +m[1]); });
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const g = f => (map[f] != null ? String(row[map[f]] ?? '').trim() : '');
    const name = g('name');
    if (!name) continue;
    let role = parseRole(g('role'));
    if (!role) { if (g('role')) warn.push(`Row ${r + 1}: role “${g('role')}” not recognised, set to Batter.`); role = 'BAT'; }
    const catTxt = g('category').toLowerCase();
    const category = /marquee|icon|star/.test(catTxt) ? 'Marquee' : /uncap/.test(catTxt) ? 'Uncapped' : 'Capped';
    const osTxt = g('overseas');
    const overseas = /overseas|foreign/.test(catTxt) || truthy(osTxt) || (!!osTxt && !/^(n|no|false|0|india|indian|domestic|local|-)$/i.test(osTxt));
    const sp = g('special').toLowerCase();
    const mystery = truthy(g('mystery')) || /myst/.test(sp);
    const wild = truthy(g('wild')) || /wild/.test(sp);
    let base = lakhCol ? Math.round(parseFloat(g('base'))) : parseMoney(g('base'), { guessLakhs: true });
    if (base == null || !isFinite(base)) { if (g('base')) warn.push(`Row ${r + 1}: base price “${g('base')}” not understood, set to ${money(cr2l(0.5))}.`); base = cr2l(0.5); }
    let id = g('id');
    if (!id) id = 'P' + String(++n).padStart(3, '0');
    else if (/^\d+$/.test(id)) id = 'P' + id.padStart(3, '0');
    const photo = /^(https?:|data:image)/i.test(g('photo')) ? g('photo') : '';
    const p = newPlayer({
      id, name, role, bat: /^(l|lh|left)/i.test(g('bat')) ? 'Left Hand' : 'Right Hand', bowl: g('bowl'),
      rating: clamp(parseInt(g('rating'), 10) || 70, 0, 100), base, category, overseas,
      tags: g('tags') ? g('tags').split(/[|;,]/).map(s => s.trim()).filter(Boolean).map(tagFromText) : [],
      mystery: mystery && !wild, wild, clues: g('clues') ? g('clues').split('|').map(s => s.trim()).filter(Boolean) : [], photo,

  }
  const ids = new Set();
  out.forEach(p => { if (ids.has(p.id)) warn.push(`Player ID ${p.id} appears more than once; the last row wins.`); ids.add(p.id); });
  return { out, warn, map };
}

async function exportData(ds, fmt) {
  const all = datasets();
  const keys = ds === 'all' ? Object.keys(all) : [ds];
  const base = slugify(S.event.name);
  try {
    if (fmt === 'csv') { const d = all[ds]; return saveFile(`${base}-${ds}.csv`, toCSV([d.head, ...d.rows]), 'text/csv'); }
    if (fmt === 'xlsx') {
      toast('Preparing the Excel file…', 'info');
      await loadLib('xlsx');
      const wb = XLSX.utils.book_new();
      for (const k of keys) {
        const d = all[k];
        const ws = XLSX.utils.aoa_to_sheet([d.head, ...d.rows]);
        ws['!cols'] = d.head.map((h, i) => ({ wch: Math.min(42, Math.max(String(h).length, ...d.rows.slice(0, 300).map(r => String(r[i] ?? '').length)) + 2) }));
        XLSX.utils.book_append_sheet(wb, ws, d.sheet);
      }
      const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      return saveFile(`${base}-${ds === 'all' ? 'everything' : ds}.xlsx`, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    }
    if (fmt === 'pdf') {
      toast('Preparing the PDF…', 'info');
      await loadLib('jspdf'); await loadLib('autotable');

    }
  } catch (e) {
    toast(e && e.message === 'offline' ? 'Excel and PDF need an internet connection the first time. CSV works offline.' : 'Export failed: ' + ((e && e.message) || e), 'bad', 6000);
  }
}
function buildPDF(keys, all, full) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  doc.setFillColor(8, 13, 36); doc.rect(0, 0, W, 74, 'F');
  doc.setFillColor(157, 221, 144); doc.rect(0, 74, W, 4, 'F');

  doc.text(stripEmoji(S.event.name || 'Auction') + (full ? ' — Final report' : ''), 36, 44);

  doc.text(stripEmoji([S.event.host, S.event.date, 'Generated ' + new Date().toLocaleString()].filter(Boolean).join('   ·   ')), 36, 62);
  let y = 104;
  const section = title => {
    if (y > H - 120) { doc.addPage(); y = 50; }
    doc.setTextColor(8, 13, 36); doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.text(stripEmoji(title), 36, y);
  };
  const table = (head, body) => {
    doc.autoTable({
      startY: y + 8, head: [head.map(stripEmoji)], body: body.map(r => r.map(c => stripEmoji(c))),
      styles: { fontSize: 8, cellPadding: 3, textColor: [20, 22, 40] }, headStyles: { fillColor: [8, 13, 36], textColor: [248, 213, 126], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [245, 245, 245] }, margin: { left: 36, right: 36 },
    });
    y = doc.lastAutoTable.finalY + 28;
  };
  for (const k of keys) {
    const d = all[k];
    if (k === 'squads' && full) {
      for (const t of S.teams) {
        const ti = D().ti[t.id];
        section(`${t.name} — ${ti.count} players · spent ${money(ti.spent, { pdf: true })} · ${money(ti.purse, { pdf: true })} left`);
        const an = ti.an;
        table(['Player', 'Role', 'Price', 'Acquired'], ti.squad.slice().sort((a, b) => b.soldPrice - a.soldPrice).map(p => [p.name + (p.overseas ? ' (overseas)' : ''), ROLE_INFO[p.role].n, money(p.soldPrice, { pdf: true }), p.acq === 'rtm' ? 'RTM' : p.acq === 'direct' ? 'Assigned' : 'Auction']).concat([['Analysis (guide only)', `Strength ${an.strength} · Balance ${an.balance} · Versatility ${an.versatility}`, `Value ${an.value}`, `Bat ${an.batting} · Bowl ${an.bowling} · WK ${an.wk}`]]));
      }
      continue;
    }
    section(d.title);
    table(d.head, d.rows.length ? d.rows : [['None']]);
  }
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120, 120, 120); doc.text(`${stripEmoji(S.event.name || '')} · page ${i} of ${pages}`, W - 36, H - 18, { align: 'right' }); }
  return doc;
}

function bulkOp(op, arg) {

  if (op === 'delete') {

      onOk: () => { const del = ids.filter(id => !blocked.includes(id)); commit(() => { S.players = S.players.filter(p => !del.includes(p.id)); S.queue = S.queue.filter(x => !del.includes(x)); }); UI.sel = []; renderNow(); },

/* ---------- Keyboard ---------- */
function onKey(e) {
  if (!S) return;
  if (e.repeat && !/^(Arrow|Backspace|Delete)/.test(e.key)) return;   // holding a key never fires an action twice
  if (MODE === 'projector') { if (e.key === 'f' || e.key === 'F') toggleFullscreen(); return; }
  const field = e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]');
  if (MODAL) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
    if (e.key === 'Enter' && MODAL.onEnter && !(field && field.tagName === 'TEXTAREA') && !(field && field.type === 'file')) { e.preventDefault(); MODAL.onEnter(); return; }
    if (!field && MODAL.keys && !e.ctrlKey && !e.metaKey) { const f = MODAL.keys[e.key.toLowerCase()]; if (f) { e.preventDefault(); f(); } }
    return;
  }
  if (field) { if (e.key === 'Escape') field.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === '?') { e.preventDefault(); return openShortcuts(); }
  if (k === 'v' || k === 'V') return toggleProjView();
  if (k === 'f' || k === 'F') return toggleFullscreen();
  if (k === 'Escape') { if (!dismissFx() && UI.projView) toggleProjView(false); return; }
  if (UI.page !== 'control' && !UI.projView) return;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
  if (e.code && /^Digit\d$/.test(e.code)) {
    const dgt = +e.code.slice(5);
    let idx = dgt === 0 ? 9 : dgt - 1;
    if (e.shiftKey) idx = dgt >= 1 && dgt <= 5 ? 9 + dgt : -1;
    if (idx >= 0 && S.teams[idx]) { e.preventDefault(); bidTeam(S.teams[idx].id); }
    return;
  }
  switch (k.toLowerCase()) {
    case ' ': spaceBid(); break;
    case 'enter': if (!S.started) startAuction(); else if (S.live.phase === 'ready') startBidding();   // first Enter shows the player on the projector, the next opens bidding else if (S.live.phase === 'empty' || S.live.phase === 'done') nextPlayer(); break;
    case 'g': closeCall(); break;
    case 's': askSold(); break;
    case 'u': openUnsold(); break;
    case 'r': undoKey(); break;
    case 'n': nextPlayer(); break;
    case 'p': prevPlayer(); break;
    case 'm': mysteryKey(e.shiftKey); break;
    case 't': rtmKey(); break;
    case 'c': openCustomBid(); break;
    case 'x': openPass(); break;
    case 'a': openAlerts(); break;
    default: return;
  }
}
function onKeyUp(e) {
  if (e.key === ' ' && !(e.target && e.target.closest && e.target.closest('input,textarea,select'))) e.preventDefault();
}

/* ---------- Lock: only one window runs the auction ---------- */
function showLock(kind) {
  const el = $('#lock');
  el.hidden = false;
  el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="lockT"><header><h2 id="lockT">${kind === 'moved' ? 'CONTROL MOVED' : 'ALREADY OPEN'}</h2></header>
    <div class="m-body"><p>${kind === 'moved' ? 'Another window took control of the auction. This one now only shows it.' : 'This auction is already running in another window or tab. Use that one, or take control here.'}</p>
    <p class="muted">Only one window runs the auction at a time, so no bid is saved twice.</p></div>
    <footer><button class="btn ghost" data-act="lock-view">VIEW ONLY</button><button class="btn blue" data-act="lock-take">TAKE CONTROL HERE</button></footer></div>`;
  paintSave();
}

/* ---------- Shell ---------- */
function buildShell() {
  const nav = [['control', 'Auction'], ['players', 'Players'], ['teams', 'Teams'], ['results', 'Reports'], ['judging', 'Judging'], ['admin', 'Fixes'], ['setup', 'Setup']];
  $('#rail').innerHTML = `<div class="brand">${BALL}<span>AUCTION</span></div>
    ${nav.map(([k, l]) => `<button class="nav" data-act="nav" data-page="${k}" title="${l}">${ICON[k]}<span>${l}</span></button>`).join('')}
    <div class="rail-foot"><button class="nav" data-act="projector-menu" title="Projector">${ICON.projector}<span>Projector</span></button></div>`;
}

/* ---------- Events ---------- */
function wire() {
  document.addEventListener('click', e => {
    SFX.unlock();
    const el = e.target.closest('[data-act]');
    if (!el) {
      if (MODAL && e.target === $('#modal') && MODAL.id !== 'confirm' && MODAL.id !== 'rtm' && MODAL.id !== 'pe' && MODAL.id !== 'import') closeModal();
      return;
    }
    if (el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (ONCE.has(el.dataset.act)) {   // an accidental double click on bid / sold / next does not count twice
      const key = el.dataset.act + '|' + (el.dataset.team || el.dataset.pid || '');
      if (key === lastHit.key && Date.now() - lastHit.t < 350) { e.preventDefault(); return; }
      lastHit = { key, t: Date.now() };
    }
    if (el.tagName === 'BUTTON' && e.detail > 0) el.blur();
    e.preventDefault();
    fn(el.dataset, el, e);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.bind) return bindChange(el);
    if (el.dataset && el.dataset.ch && CH[el.dataset.ch]) CH[el.dataset.ch](el);
  });
  document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.in && IN[el.dataset.in]) IN[el.dataset.in](el); });
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKeyUp);
  document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.parentElement && (t.parentElement.classList.contains('ph') || t.parentElement.classList.contains('logo'))) t.remove(); }, true);
  let drag = null;
  document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('[data-qpid]'); if (!li) return; drag = li.dataset.qpid; li.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag); } catch (x) {} });
  document.addEventListener('dragover', e => {
    const li = e.target.closest && e.target.closest('[data-qpid]'); if (!li || !drag) return;
    e.preventDefault();
    const r = li.getBoundingClientRect(), top = e.clientY < r.top + r.height / 2;
    $$('.qi.over-top,.qi.over-bot').forEach(x => x.classList.remove('over-top', 'over-bot'));
    li.classList.add(top ? 'over-top' : 'over-bot');
  });
  document.addEventListener('drop', e => {
    const li = e.target.closest && e.target.closest('[data-qpid]'); if (!li || !drag) return;
    e.preventDefault();
    const r = li.getBoundingClientRect();
    qDrop(drag, li.dataset.qpid, e.clientY < r.top + r.height / 2);
  });
  document.addEventListener('dragend', () => { drag = null; $$('.qi.dragging,.qi.over-top,.qi.over-bot').forEach(x => x.classList.remove('dragging', 'over-top', 'over-bot')); });
  let idleT = null;
  document.addEventListener('mousemove', () => { const pr = $('#proj'); if (!pr) return; pr.classList.remove('idle-mouse'); clearTimeout(idleT); idleT = setTimeout(() => pr.classList.add('idle-mouse'), 2500); });
  if (BC) BC.onmessage = ev => onSync(ev.data || {});
  window.addEventListener('storage', e => {
    if (BC || e.key !== LS_KEY || !e.newValue) return;
    if (MODE === 'projector' || !CONTROLLER) { try { S = migrate(JSON.parse(e.newValue)); render(); } catch (x) {} }
  });
}
let booting = true, otherController = false;
function onSync(m) {
  if (m.from === TAB) return;
  if (m.type === 'state') { if (MODE === 'projector' || !CONTROLLER) { S = migrate(m.state); render(); } }
  else if (m.type === 'media') { MEDIA.set(m.id, m.url); render(); }
  else if (m.type === 'who') { if (MODE === 'control' && CONTROLLER && S) { bcPost({ type: 'here' }); bcPost({ type: 'state', state: S }); } }
  else if (m.type === 'here') { if (MODE === 'control' && booting) otherController = true; }
  else if (m.type === 'takeover') { if (MODE === 'control' && CONTROLLER) { CONTROLLER = false; closeModal(); showLock('moved'); } }
}

async function boot() {
  wire();
  if (MODE === 'projector') { document.body.classList.add('mode-proj'); document.title = 'Projector · ' + document.title; }
  idb = await idbOpen();
  const a = await idbGet('state');
  let b = null;
  try { b = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  const st = a && b ? ((b.updated || 0) > (a.updated || 0) ? b : a) : (a || b);
  const restored = !!(st && Array.isArray(st.players));
  if (restored) S = migrate(st);
  if (restored && S.sample && MODE === 'control' && !S.players.some(p => p.s26)) S = buildSample();   // old practice data → new player list
  else S = MODE === 'control' ? buildSample() : blankState();
  CK = (await idbGet('ck')) || [];
  for (const [k, v] of await idbEntries()) if (typeof k === 'string' && k.startsWith('m:')) MEDIA.set(k.slice(2), v);
  if (MODE === 'projector') {
    const pr = $('#proj'); pr.hidden = false;
    renderProj();
    bcPost({ type: 'who' });
    setInterval(paintClose, 250);
    return;
  }
  buildShell();
  nav(UI.page || 'control');
  setInterval(() => { paintClose(); autoTick(); }, 250);
  bcPost({ type: 'who' });
  setTimeout(() => {
    booting = false;
    if (otherController) { CONTROLLER = false; showLock('open'); return; }
    if (!restored) persist();
    else { saveInfo.at = st.updated || null; paintSave(); toast('✅ Auction restored' + (st.updated ? ', last saved ' + hhmmss(st.updated) : '') + '.', 'good', 4000); }
  }, 400);
}
boot();
